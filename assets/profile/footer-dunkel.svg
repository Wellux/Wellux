<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-labelledby="t d"><title id="t">Des basst scho</title><desc id="d">A last drop falls, the last block turns green: Des basst scho, now automated.</desc><style>@font-face{font-family:PlexS;src:url(data:font/woff2;base64,) format('woff2')}.f-PlexS{font-family:PlexS,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:PlexM;src:url(data:font/woff2;base64,) format('woff2')}.f-PlexM{font-family:PlexM,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@keyframes drop{0%{opacity:0;transform:translateY(-18px)}65%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-48}}.dp{animation:drop .55s cubic-bezier(.2,.9,.25,1) both}.ri{animation:rise .7s ease-out both}.dw{animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}.fl{animation:flow 1.6s linear infinite}@keyframes fall{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}55%{transform:translateY(0);opacity:1}60%,100%{transform:translateY(0);opacity:0}}.fa{animation:fall 3s cubic-bezier(.5,0,.8,.6) infinite}@keyframes okc{0%,55%{fill:#2EA6DA}60%,100%{fill:#3FD3A0}}.ok{animation:okc 3s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.dw{stroke-dashoffset:0}.rm-hide{display:none}}</style><path class="fa rm-hide" d="M805.0 36 c5 7 8 11 8 15a8 8 0 0 1-16 0c0-4 3-8 8-15z" fill="#21A8E0"/><rect class="dp" style="animation-delay:0.10s" x="465.0" y="96" width="20" height="20" rx="4" fill="#2EA6DA"/><rect class="dp" style="animation-delay:0.15s" x="495.0" y="96" width="20" height="20" rx="4" fill="#2EA6DA"/><rect class="dp" style="animation-delay:0.20s" x="525.0" y="96" width="20" height="20" rx="4" fill="#2EA6DA"/><rect class="dp" style="animation-delay:0.25s" x="555.0" y="96" width="20" height="20" rx="4" f