<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320" role="img" aria-labelledby="t d"><title id="t">myos up</title><desc id="d">A terminal starts myOS: brain, agents, cockpit, pipes and you are ready.</desc><style>@font-face{font-family:PlexM;src:url(data:font/woff2;base64,) format('woff2')}.f-PlexM{font-family:PlexM,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@keyframes drop{0%{opacity:0;transform:translateY(-18px)}65%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-48}}.dp{animation:drop .55s cubic-bezier(.2,.9,.25,1) both}.ri{animation:rise .7s ease-out both}.dw{animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}.fl{animation:flow 1.6s linear infinite}@keyframes ty0{from{width:0}to{width:560px}}@keyframes blink{50%{opacity:0}}.cur{animation:blink 1s steps(1) infinite}@media (prefers-reduced-motion:reduce){clipPath rect{width:580px!important}*{animation:none!important}.dw{stroke-dashoffset:0}.rm-hide{display:none}}</style><rect x=".5" y=".5" width="619" height="319" rx="14" fill="#111821" stroke="#262D36"/><path d="M1 44 H619" stroke="#262D36"/><circle cx="26" cy="22" r="6" fill="none" stroke="#6E7379" stroke-width="1.5"/><circle cx="46" cy="22" r="6" fill="none" stroke="#6E7379" stroke-width="1.5"/><circle cx="66" cy="22" r="6" fill="none" stroke="#6E7379" stroke-width="1.5"/><text class="f-PlexM" x="310.0" y="27" text-anchor="middle" font-size="13" fill="#7D8590">marco@myOS ~ zsh</text><clipPath id="cl0"><rect x="20" y="62" height="30" width="0"><animate attributeName="width" from="0" to="580" begin="0.40s" dur=".5s" fill="freeze" calcMode="spline" keySplines=".3 0 .4 1" keyTimes="0;1"/></rect></clipPath><g clip-path="url(#cl0)"><text class="f-PlexM" x="28" y="84" font-size="17" fill="#2EA6DA">$</text><text class="f-PlexM" x="48" y="84" font-